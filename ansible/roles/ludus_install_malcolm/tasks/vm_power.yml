---
- name: Check Malcolm VM power on the Ludus host
  become: true
  delegate_to: localhost
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  when:
    - hostvars[inventory_hostname].proxmox_vmid is defined
    - not ansible_check_mode
  block:
    - name: Validate the Malcolm inventory VM ID
      ansible.builtin.assert:
        that:
          - hostvars[inventory_hostname].proxmox_vmid is not boolean
          - (hostvars[inventory_hostname].proxmox_vmid | string) is match('^[1-9][0-9]*$')
        fail_msg: Malcolm requires a positive Proxmox inventory VM ID.

    - name: Read current Proxmox VM resources
      ansible.builtin.command:
        argv:
          - "{{ _ludus_install_malcolm_pvesh_command | default('/usr/bin/pvesh') }}"
          - get
          - /cluster/resources
          - --type
          - vm
          - --output-format
          - json
      register: _ludus_install_malcolm_vm_resources
      changed_when: false

    - name: Locate the Malcolm VM by inventory ID
      ansible.builtin.set_fact:
        _ludus_install_malcolm_vm_matches: >-
          {{ (_ludus_install_malcolm_vm_resources.stdout | from_json)
             | selectattr('type', 'equalto', 'qemu')
             | selectattr('vmid', 'equalto', hostvars[inventory_hostname].proxmox_vmid | int)
             | list }}

    - name: Require exactly one matching Proxmox VM
      ansible.builtin.assert:
        that:
          - _ludus_install_malcolm_vm_matches | length == 1
        fail_msg: The Malcolm inventory VM ID must resolve to exactly one QEMU VM.

    # Cluster resource status may lag; make the start decision using live state.
    - name: Read the Malcolm VM power state from its node
      ansible.builtin.command:
        argv:
          - "{{ _ludus_install_malcolm_pvesh_command | default('/usr/bin/pvesh') }}"
          - get
          - "/nodes/{{ _ludus_install_malcolm_vm_matches[0].node }}/qemu/{{ hostvars[inventory_hostname].proxmox_vmid | int }}/status/current"
          - --output-format
          - json
      register: _ludus_install_malcolm_vm_initial_power
      changed_when: false

    - name: Require a supported Malcolm VM power state
      ansible.builtin.assert:
        that:
          - (_ludus_install_malcolm_vm_initial_power.stdout | from_json).status in ['running', 'stopped']
        fail_msg: The Malcolm VM must be running or stopped before the power-on check.

    - name: Start the Malcolm VM only when stopped
      ansible.builtin.command:
        argv:
          - "{{ _ludus_install_malcolm_pvesh_command | default('/usr/bin/pvesh') }}"
          - create
          - "/nodes/{{ _ludus_install_malcolm_vm_matches[0].node }}/qemu/{{ hostvars[inventory_hostname].proxmox_vmid | int }}/status/start"
      when: (_ludus_install_malcolm_vm_initial_power.stdout | from_json).status == 'stopped'
      changed_when: true

    - name: Verify the Malcolm VM is running
      ansible.builtin.command:
        argv:
          - "{{ _ludus_install_malcolm_pvesh_command | default('/usr/bin/pvesh') }}"
          - get
          - "/nodes/{{ _ludus_install_malcolm_vm_matches[0].node }}/qemu/{{ hostvars[inventory_hostname].proxmox_vmid | int }}/status/current"
          - --output-format
          - json
      register: _ludus_install_malcolm_vm_power
      changed_when: false
      until: (_ludus_install_malcolm_vm_power.stdout | from_json).status == 'running'
      retries: 24
      delay: 5
